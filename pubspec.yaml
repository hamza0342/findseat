name: find_seat
description: A new Flutter application.

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0  

  # iOS style icons
  cupertino_icons: ^1.0.8

  # Networking + JSON
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  dio: ^5.7.0

  # UI
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1
  google_maps_flutter: ^2.9.0
  dotted_border: ^2.1.0
  shimmer: ^3.0.0

  # Utilities
  freezed: ^2.5.7
  intl: any
  uuid: ^4.5.1

  # Local Storage
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1

  # YouTube Player
  youtube_player_flutter: ^9.0.0

  # Firebase / Auth
  firebase_core: ^3.12.0
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2

  # Payments
  stripe_payment: ^1.1.4   # ⚠️ Deprecated – might need migration later

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^9.1.0
  equatable: ^2.0.5
  meta: ^1.15.0
  sprintf: ^7.0.0
  build_runner: ^2.4.12
  retrofit_generator: ^8.1.2
  json_serializable: ^6.9.0
  test: ^1.25.2

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.otf
          weight: 400
        - asset: fonts/Poppins-Medium.otf
          weight: 500
        - asset: fonts/Poppins-SemiBold.otf
          weight: 600
    - family: Oswald
      fonts:
        - asset: fonts/Oswald-Regular.ttf
          weight: 400

  assets:
    - assets/
    - images/
    - images/movie/
    - images/events/
    - images/plays/
    - images/casts/
    - images/cines/
